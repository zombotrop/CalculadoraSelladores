<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1A54A3"><title>Calculadora de Selladores | Joe’s Home Center</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font:16px system-ui,Arial;color:#25334a}.wrap{max-width:580px;margin:auto;padding:24px}h1{font-size:23px;color:#1A54A3;margin:0 0 5px}p{color:#586476;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-weight:650;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #cdd5e1;border-radius:8px;font-size:18px;background:white}small{display:block;color:#586476;margin-top:3px}.buttons{display:flex;gap:10px;margin:20px 0}.buttons button{flex:1}button{border:0;border-radius:8px;padding:14px;cursor:pointer;font-weight:750;font-size:15px}.primary{background:#1A54A3;color:white}.secondary{background:#e5eaf2;color:#24324a}.card{background:white;border:1px solid #dce3ee;border-radius:10px;padding:18px}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}strong{display:block;color:#1A54A3;font-size:23px;margin-top:6px;overflow-wrap:anywhere}.copy{background:#F18230;color:white;width:100%}.error{color:#b42318;min-height:24px;margin:8px 0}.foot{margin-top:14px;font-size:13px}@media(max-width:370px){.wrap{padding:14px}h1{font-size:20px}.results strong{font-size:19px}}</style></head><body><main class="wrap"><h1>CALCULADORA DE SELLADORES</h1><p>Joe’s Home Center · Rendimiento editable para cualquier sellador</p><div class="grid"><section><label>Largo</label><div class="pair"><div><input id="lf" type="number" min="0" step="any" value="0"><small>Pies</small></div><div><input id="li" type="number" min="0" step="any" value="0"><small>Pulgadas</small></div></div></section><section><label>Ancho</label><div class="pair"><div><input id="af" type="number" min="0" step="any" value="0"><small>Pies</small></div><div><input id="ai" type="number" min="0" step="any" value="0"><small>Pulgadas</small></div></div></section></div><label for="yield">Rendimiento por paila (pies² por capa)</label><input id="yield" type="number" min="0" step="any" value="0"><label for="coats">Número de capas</label><input id="coats" type="number" min="0" step="1" value="0"><div class="buttons"><button class="primary" id="calc">CALCULAR</button><button class="secondary" id="clear">LIMPIAR</button></div><div class="error" id="error" role="alert"></div><div class="card"><b>RESULTADO</b><div class="results"><div>Área total<strong id="area">—</strong></div><div>Pailas necesarias<strong id="buckets">—</strong></div></div><button class="copy" id="copy">COPIAR RESULTADO</button></div><p class="foot">Se redondea hacia arriba a la próxima paila completa.</p></main><script>
const ids=['lf','li','af','ai','yield','coats'];const el=id=>document.getElementById(id);let detail='';
function resetResult(){el('area').textContent='—';el('buckets').textContent='—';detail='';}
function calculate(){el('error').textContent='';let n=ids.map(id=>Number(el(id).value));if(ids.some(id=>el(id).value.trim()==='')||n.some(x=>!Number.isFinite(x)||x<0)){resetResult();el('error').textContent='Ingresa números válidos y no negativos.';return}
let [lf,li,af,ai,yieldPer,coats]=n;let length=lf+li/12,width=af+ai/12;if(length<=0||width<=0||yieldPer<=0||!Number.isInteger(coats)||coats<=0){resetResult();el('error').textContent='El largo, ancho, rendimiento y capas deben ser mayores que cero; las capas deben ser enteras.';return}
let area=length*width,buckets=Math.ceil(area*coats/yieldPer);if(!Number.isFinite(buckets)||!Number.isSafeInteger(buckets)){resetResult();el('error').textContent='Los valores son demasiado grandes.';return}
el('area').textContent=area.toLocaleString('es-PR',{maximumFractionDigits:2})+' pies²';el('buckets').textContent=buckets.toLocaleString('es-PR');detail=`Área del techo: ${el('area').textContent}\nCapas: ${coats}\nRendimiento por paila y capa: ${yieldPer} pies²\nPailas necesarias: ${buckets}`;}
el('calc').onclick=calculate;el('clear').onclick=()=>{ids.forEach(id=>el(id).value='0');el('error').textContent='';resetResult()};el('copy').onclick=async()=>{if(!detail)calculate();if(!detail)return;try{await navigator.clipboard.writeText(detail);el('error').textContent='Resultado copiado.'}catch(e){el('error').textContent='Tu navegador no permite copiar automáticamente en este contexto.'}};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
